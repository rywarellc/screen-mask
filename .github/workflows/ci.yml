name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      # Serialized on purpose. Several tests encode and decode real video, and
      # the runner's paravirtualised codec fails under concurrent load
      # ("Cannot Decode", AppleM2ScalerParavirtDriver). Locally, on real
      # hardware, plain `swift test` runs them in parallel just fine.
      - name: Test
        run: swift test --no-parallel

      - name: Assemble app bundle
        run: ./build.sh
