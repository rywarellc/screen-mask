name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      # Two of these encode and decode real video. If the runner turns out to
      # lack a usable VideoToolbox encoder, those are the ones that will fail.
      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: ./build.sh
